<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NaruDoc MyST editor spike</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Georgia, "Times New Roman", serif;
        line-height: 1.5;
        color: #1a1a1a;
        background: #f4f1ea;
      }
      body {
        margin: 0;
      }
      header {
        position: sticky;
        top: 0;
        display: flex;
        gap: 1rem;
        align-items: center;
        justify-content: space-between;
        padding: 0.75rem 1.5rem;
        background: #fff;
        border-bottom: 1px solid #ddd;
        font-family: system-ui, sans-serif;
      }
      header h1 {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
      }
      button {
        font: inherit;
        padding: 0.4rem 0.8rem;
        cursor: pointer;
      }
      #status {
        min-height: 1.25rem;
        color: #444;
        font-size: 0.875rem;
      }
      main {
        max-width: 42rem;
        margin: 2rem auto;
        padding: 2rem;
        background: #fff;
        box-shadow: 0 1px 4px rgb(0 0 0 / 8%);
      }
      [contenteditable] {
        outline: 1px dashed transparent;
      }
      [contenteditable]:hover,
      [contenteditable]:focus {
        outline-color: #8aa;
      }
      h1,
      h2 {
        margin: 0 0 0.75rem;
      }
      p,
      ul {
        margin: 0 0 1rem;
      }
      .note {
        margin: 0 0 1rem;
        padding: 0.75rem 1rem;
        border-left: 4px solid #2a6;
        background: #f3faf5;
      }
      .note-label {
        font-family: system-ui, sans-serif;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #2a6;
      }
      .note p {
        margin: 0.25rem 0 0;
      }
      .math {
        margin: 0 0 1rem;
        padding: 0.75rem 1rem;
        background: #f6f6f6;
        font-family: ui-monospace, monospace;
        white-space: pre-wrap;
      }
      .math-label {
        font-family: system-ui, sans-serif;
        font-size: 0.75rem;
        color: #666;
        margin-bottom: 0.35rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>sample.md</h1>
      <div>
        <div id="status">Load a document, edit, then save to output.md.</div>
        <button id="save" type="button">Save to output.md</button>
      </div>
    </header>
    <main id="doc"></main>
    <script type="module" src="/src/editor.ts"></script>
  </body>
</html>
