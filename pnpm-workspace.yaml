packages:
  - packages/*
  - apps/*

# tsx uses esbuild's native executable; approve its install-time binary check.
allowBuilds:
  esbuild@0.28.2: true

# Already locked on master before the pnpm 12 migration (2026-09-23).
# Keep the built-in release-age policy; exempt only these existing versions.
minimumReleaseAgeExclude:
  - cn@0.4.0
  - fs-extra@11.4.1

# Upstream smartquotes DoS fix, backported without changing MyST's 13.x API/peers.
# Rationale and removal condition: docs/reviews/myst-security-alignment-v1.md
patchedDependencies:
  markdown-it@13.0.2: patches/markdown-it@13.0.2.patch
  # A caret key right after focus is not undone by ProseMirror's focus restore (#144).
  # Cause, applied version and removal condition: docs/reviews/prosemirror-focus-caret-2026-10-09.md
  prosemirror-view@1.42.4: patches/prosemirror-view@1.42.4.patch
