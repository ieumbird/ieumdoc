name: Issue policy

on:
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-policy-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v9
        with:
          script: |
            const { pathToFileURL } = await import('node:url');
            const { checkIssueEvent } = await import(pathToFileURL(process.env.GITHUB_WORKSPACE + '/scripts/check-issue-event.mjs').href);
            await checkIssueEvent({ github, context, core });
