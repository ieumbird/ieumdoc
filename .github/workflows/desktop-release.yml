name: Desktop release (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing trusted master tag matching the Desktop version (vX.Y.Z[-beta.N])
        required: true
        type: string
      mode:
        description: Verify only, publish an unsigned Beta, or publish with Authenticode signing
        required: true
        default: verify
        type: choice
        options:
          - verify
          - unsigned-beta
          - signed

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      # Execute the controller from the dispatch master commit, never unverified tag code.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: Validate mode, existing tag, master ancestry and package version
        id: tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_MODE: ${{ inputs.mode }}
          TRUSTED_COMMIT: ${{ github.sha }}
        run: |
          node apps/desktop/scripts/release.ts preflight --tag $env:RELEASE_TAG --mode $env:RELEASE_MODE --trusted $env:TRUSTED_COMMIT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  build:
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 45
    environment: ${{ inputs.mode == 'signed' && 'desktop-release' || 'desktop-check' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@v6
        with:
          version: 12.5.1
          cache: true
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm browser:test
      - name: Stable install/update regression before the final package
        run: pnpm --filter @ieumdoc/desktop test:update
      - name: Beta install/update regression before the final package
        env:
          IEUMDOC_TEST_UPDATE_CHANNEL: beta
        run: pnpm --filter @ieumdoc/desktop test:update
      - name: Build unsigned verification or Beta package
        if: inputs.mode != 'signed'
        run: pnpm --filter @ieumdoc/desktop package
      - name: Build signed public package
        if: inputs.mode == 'signed'
        shell: pwsh
        env:
          IEUMDOC_RELEASE: '1'
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          if (-not $env:CSC_LINK) { throw 'WINDOWS_CSC_LINK is required for signed publication' }
          pnpm --filter @ieumdoc/desktop package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify final artifacts, executable versions and required signatures
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          $verifyArgs = @('--filter', '@ieumdoc/desktop', 'exec', 'tsx', 'scripts/verify-release.ts', '--tag', $env:RELEASE_TAG)
          if ($env:RELEASE_MODE -eq 'signed') { $verifyArgs += '--signed' }
          pnpm @verifyArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: pnpm --filter @ieumdoc/desktop test:packaged
      - uses: actions/upload-artifact@v6
        with:
          name: desktop-release
          path: |
            apps/desktop/release/IeumDoc-Setup-*.exe
            apps/desktop/release/IeumDoc-Setup-*.exe.blockmap
            apps/desktop/release/latest.yml
            apps/desktop/release/beta.yml
            apps/desktop/release/win-unpacked/
          if-no-files-found: error
          retention-days: 14

  publish:
    if: inputs.mode != 'verify' && github.ref == 'refs/heads/master'
    needs: [preflight, build]
    runs-on: windows-latest
    timeout-minutes: 15
    environment: desktop-release
    permissions:
      contents: write
    steps:
      # The trusted controller rechecks the remote tag and all downloaded artifacts.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@v6
        with:
          version: 12.5.1
          cache: true
          run_install: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: desktop-release
          path: apps/desktop/release
      - name: Recheck, create Draft, upload by ID, verify server hashes and activate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_MODE: ${{ inputs.mode }}
          TRUSTED_COMMIT: ${{ github.sha }}
          RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
        run: |
          pnpm --filter @ieumdoc/desktop exec tsx scripts/release.ts publish --tag $env:RELEASE_TAG --mode $env:RELEASE_MODE --trusted $env:TRUSTED_COMMIT --commit $env:RELEASE_COMMIT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
