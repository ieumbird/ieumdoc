name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  quality:
    name: Core, CLI, and Editor quality
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.5.1
          cache: true
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Documentation checks
        run: |
          pnpm exec tsx --test scripts/check-docs.test.ts
          pnpm docs:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Run Core, CLI, and Editor tests
        run: pnpm test

      - name: Build Editor for production
        run: pnpm --filter @ieumdoc/editor build

  browser:
    name: Editor browser regressions (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      IEUMDOC_BROWSER_SHARD: ${{ matrix.shard }}/2

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.5.1
          cache: true
          run_install: false

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Chromium and Linux dependencies
        run: pnpm exec playwright-cli install-browser chromium --with-deps

      - name: Run Editor browser regressions
        shell: bash
        run: |
          set -Eeuo pipefail

          server_log="$RUNNER_TEMP/editor-vite.log"
          server_pgid_file="$RUNNER_TEMP/editor-server.pgid"
          session="ieumdoc-browser-regression"
          rm -f "$server_pgid_file"
          setsid bash -c 'printf "%s\n" "$$" >"$1"; exec pnpm editor' \
            ieumdoc-editor "$server_pgid_file" >"$server_log" 2>&1 &
          server_launcher_pid=$!
          server_pgid=""

          cleanup() {
            status=$?
            trap - EXIT INT TERM

            if [[ -z "$server_pgid" && -s "$server_pgid_file" ]]; then
              server_pgid=$(cat "$server_pgid_file")
            fi

            timeout --signal=TERM --kill-after=5s 15s \
              pnpm exec playwright-cli -s="$session" close >/dev/null 2>&1 || true

            if [[ -n "$server_pgid" ]] && kill -0 -- "-$server_pgid" 2>/dev/null; then
              kill -TERM -- "-$server_pgid" 2>/dev/null || true
              for _ in {1..10}; do
                kill -0 -- "-$server_pgid" 2>/dev/null || break
                sleep 1
              done
              kill -KILL -- "-$server_pgid" 2>/dev/null || true
            elif kill -0 "$server_launcher_pid" 2>/dev/null; then
              kill -TERM "$server_launcher_pid" 2>/dev/null || true
            fi
            wait "$server_launcher_pid" 2>/dev/null || true
            rm -f "$server_pgid_file"

            if [ "$status" -ne 0 ]; then
              echo "Editor dev server log (failure):"
              cat "$server_log" || true
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          ready=false
          for _ in {1..60}; do
            if [[ -z "$server_pgid" && -s "$server_pgid_file" ]]; then
              server_pgid=$(cat "$server_pgid_file")
            fi
            if curl --fail --silent http://127.0.0.1:5173/api/document >/dev/null; then
              ready=true
              break
            fi
            if [[ -n "$server_pgid" ]] && ! kill -0 -- "-$server_pgid" 2>/dev/null; then
              echo "Editor dev server exited before readiness."
              cat "$server_log"
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            echo "Editor dev server did not become ready at http://127.0.0.1:5173/api/document within 60 seconds."
            exit 1
          fi

          pnpm browser:test --shard="$IEUMDOC_BROWSER_SHARD"

      - name: Upload Editor dev server log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: editor-browser-ci-logs-${{ matrix.shard }}
          path: ${{ runner.temp }}/editor-vite.log
          if-no-files-found: ignore
          retention-days: 7

  quality-and-browser:
    name: Core, CLI, Editor, and browser regressions
    needs: [quality, browser]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks to pass
        shell: bash
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          if [[ "$QUALITY_RESULT" != "success" || "$BROWSER_RESULT" != "success" ]]; then
            echo "Required checks did not all succeed: quality=$QUALITY_RESULT browser=$BROWSER_RESULT"
            exit 1
          fi
