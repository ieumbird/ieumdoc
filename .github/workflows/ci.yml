name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect affected CI jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      browser: ${{ github.event_name != 'pull_request' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.unknown == 'true' || steps.filter.outputs.browser == 'true' }}
      http: ${{ github.event_name != 'pull_request' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.unknown == 'true' || steps.filter.outputs.http == 'true' }}
      desktop: ${{ github.event_name != 'pull_request' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.unknown == 'true' || steps.filter.outputs.desktop == 'true' }}
      update: ${{ github.event_name != 'pull_request' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.unknown == 'true' || steps.filter.outputs.update == 'true' }}
    steps:
      # PR files come from the API; other events always run the full suite.
      - name: Filter pull request paths
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            # Package Markdown may be a fixture or distribution input.
            browser:
              - 'apps/editor/**'
              - 'packages/core/**'
              - 'packages/file-commit/**'
            http:
              - 'packages/cli/**'
              - 'apps/editor/**'
              - 'packages/core/**'
              - 'packages/file-commit/**'
            desktop:
              - 'apps/desktop/**'
              - 'apps/editor/**'
              - 'packages/core/**'
              - 'packages/file-commit/**'
            update:
              - 'apps/desktop/**'
            shared:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'patches/**'
              - 'tsconfig*'
              - '.github/workflows/**'
              - 'scripts/**'
            # An inclusion plus exclusions is required by some-with-excludes.
            # Any file outside ALL known categories forces the full suite.
            unknown:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!packages/cli/**'
              - '!apps/editor/**'
              - '!packages/core/**'
              - '!packages/file-commit/**'
              - '!apps/desktop/**'
              - '!package.json'
              - '!pnpm-lock.yaml'
              - '!pnpm-workspace.yaml'
              - '!patches/**'
              - '!tsconfig*'
              - '!.github/workflows/**'
              - '!scripts/**'

  quality:
    name: Core, CLI, Editor, and Desktop quality
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.5.1
          cache: true
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Documentation checks
        run: |
          pnpm exec tsx --test scripts/check-docs.test.ts
          pnpm docs:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Issue forms and registration checks
        run: |
          pnpm issues:forms --check
          pnpm issues:test

      - name: Run Core, CLI, Editor, and Desktop tests
        run: pnpm test

      - name: Build Editor for production
        run: pnpm --filter @ieumdoc/editor build

  browser:
    name: Editor browser regressions (${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      IEUMDOC_BROWSER_SHARD: ${{ matrix.shard }}/2

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.5.1
          cache: true
          run_install: false

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Chromium and Linux dependencies
        run: pnpm exec playwright install chromium --with-deps

      - name: Run Editor browser regressions
        env:
          IEUMDOC_BROWSER_SERVER_LOG: ${{ runner.temp }}/editor-vite.log
        run: pnpm browser:test --shard="$IEUMDOC_BROWSER_SHARD"

      - name: Upload Editor browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: editor-browser-ci-logs-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/editor-vite.log
            tmp/browser-results/
          if-no-files-found: ignore
          retention-days: 7

  http:
    name: HTTP Host package and browser (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.http == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@v6
        with:
          version: 12.5.1
          cache: true
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ieumdoc/cli package
      - run: pnpm --filter @ieumdoc/cli test:packaged
      - name: Check Windows filesystem and HTTP boundaries
        if: runner.os == 'Windows'
        run: pnpm --filter @ieumdoc/editor exec tsx --test test/http-host.test.ts
      - name: Install pinned Chromium and Linux dependencies
        if: runner.os == 'Linux'
        run: pnpm exec playwright install chromium --with-deps
      - run: pnpm browser:test http-host --screenshots
      - uses: actions/upload-artifact@v6
        with:
          name: http-host-${{ runner.os }}
          path: |
            packages/cli/dist/*.tgz
            tmp/http-host-capture/
          if-no-files-found: error
          retention-days: 7
      - name: Upload HTTP browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: http-host-diagnostics-${{ runner.os }}
          path: tmp/browser-results/
          if-no-files-found: ignore
          retention-days: 7

  desktop:
    name: Windows Desktop package and update regressions
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@v6
        with:
          version: 12.5.1
          cache: true
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ieumdoc/desktop typecheck
      - run: pnpm --filter @ieumdoc/desktop test
      - name: Install and update through a local test feed
        if: needs.changes.outputs.update == 'true'
        run: pnpm --filter @ieumdoc/desktop test:update
      - name: Build a clean package from the actual app version
        run: pnpm --filter @ieumdoc/desktop package
      - name: Validate installer and update metadata
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          pnpm --filter @ieumdoc/desktop exec tsx scripts/verify-release.ts --tag "v$version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: pnpm --filter @ieumdoc/desktop test:packaged
      - name: Upload development installer
        uses: actions/upload-artifact@v6
        with:
          name: desktop-windows-unsigned
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.yml
          if-no-files-found: error
          retention-days: 7
      - name: Upload Desktop diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: desktop-windows-diagnostics
          path: |
            tmp/desktop-e2e/profiles/*/logs/
            tmp/desktop-update/
          if-no-files-found: ignore
          retention-days: 7

  quality-and-browser:
    name: Core, CLI, Editor, and browser regressions
    needs: [changes, quality, browser, desktop, http]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks to pass
        if: ${{ always() }}
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          HTTP_RESULT: ${{ needs.http.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" || "$QUALITY_RESULT" != "success" ]]; then
            echo "Required checks did not succeed: changes=$CHANGES_RESULT quality=$QUALITY_RESULT"
            exit 1
          fi
          for result in "$BROWSER_RESULT" "$HTTP_RESULT" "$DESKTOP_RESULT"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "Selected checks did not succeed: browser=$BROWSER_RESULT http=$HTTP_RESULT desktop=$DESKTOP_RESULT"
              exit 1
            fi
          done
      - name: Reject a cancelled workflow
        if: ${{ cancelled() }}
        run: exit 1
