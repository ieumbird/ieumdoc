name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect affected CI jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      quality: ${{ steps.policy.outputs.quality }}
      browser: ${{ steps.policy.outputs.browser }}
      http: ${{ steps.policy.outputs.http }}
      desktop: ${{ steps.policy.outputs.desktop }}
      update: ${{ steps.policy.outputs.update }}
      smartquotes: ${{ steps.policy.outputs.smartquotes }}
      reused: ${{ steps.policy.outputs.reused }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: Select jobs from the event diff or successful queue run
        id: policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-execution-policy.mjs "$GITHUB_EVENT_NAME" "$GITHUB_EVENT_PATH"

  quality:
    name: Core, CLI, Editor, and Desktop quality
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Validate event base/head histories, not the synthetic merge alone.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.5.1
          cache: true
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Classify quality mode and check diff whitespace
        id: mode
        run: node scripts/ci-quality-mode.mjs "$GITHUB_EVENT_NAME" "$GITHUB_EVENT_PATH"

      - name: CI quality path classification regressions
        run: node --test scripts/ci-quality-mode.test.mjs scripts/ci-execution-policy.test.mjs

      - name: AI commit provenance regressions
        run: node --test scripts/commit-provenance.test.mjs

      - name: Check event commit provenance
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: node scripts/commit-provenance.mjs event "$GITHUB_EVENT_NAME" "$GITHUB_EVENT_PATH"

      - name: Documentation checks
        run: |
          pnpm exec tsx --test scripts/check-docs.test.ts
          pnpm docs:check

      - name: Typecheck
        if: needs.changes.outputs.quality == 'true'
        run: pnpm typecheck

      - name: Issue forms and registration checks
        run: |
          pnpm issues:forms --check
          pnpm issues:test

      - name: Run Core, CLI, Editor, and Desktop tests
        if: needs.changes.outputs.quality == 'true'
        run: pnpm test

      - name: Verify the installed smartquotes dependency patch
        if: needs.changes.outputs.smartquotes == 'true'
        run: pnpm --filter @ieumdoc/core test:smartquotes

      - name: Build Editor for production
        if: needs.changes.outputs.quality == 'true'
        run: pnpm --filter @ieumdoc/editor build

  browser:
    name: Editor browser regressions (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    container:
      # The image supplies OS dependencies; the locked alpha browser is installed below.
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host --init
      env:
        PLAYWRIGHT_BROWSERS_PATH: /github/home/.cache/ms-playwright
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      IEUMDOC_BROWSER_SHARD: ${{ matrix.shard }}/4

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.5.1
          cache: true
          run_install: false

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: /github/home/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Chromium
        timeout-minutes: 2
        run: |
          pnpm exec playwright install chromium
          fc-match :lang=ko

      - name: Run Editor browser regressions
        env:
          IEUMDOC_BROWSER_SERVER_LOG: ${{ runner.temp }}/editor-vite.log
        run: pnpm browser:test --shard="$IEUMDOC_BROWSER_SHARD"

      - name: Upload Editor browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: editor-browser-ci-logs-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/editor-vite.log
            tmp/browser-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload document scroll layout evidence
        if: always() && matrix.shard == 4
        uses: actions/upload-artifact@v6
        with:
          name: document-scroll-layout
          path: |
            tmp/document-scroll-capture/
            tmp/browser-results/scenarios-document-scroll/scenario-result.json
          if-no-files-found: ignore
          retention-days: 7

  http:
    name: HTTP Host package and browser (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.http == 'true'
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            container:
              image: mcr.microsoft.com/playwright:v1.64.0-noble
              options: --ipc=host --init
              env:
                PLAYWRIGHT_BROWSERS_PATH: /github/home/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@v6
        with:
          version: 12.5.1
          cache: true
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ieumdoc/cli package
      - run: pnpm --filter @ieumdoc/cli test:packaged
      - name: Check Windows filesystem and HTTP boundaries
        if: runner.os == 'Windows'
        run: pnpm --filter @ieumdoc/editor exec tsx --test test/http-host.test.ts
      - name: Cache Playwright browsers
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: /github/home/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install pinned Chromium
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: |
          pnpm exec playwright install chromium
          fc-match :lang=ko
      - run: pnpm browser:test http-host --screenshots
      - uses: actions/upload-artifact@v6
        with:
          name: http-host-${{ runner.os }}
          path: |
            packages/cli/dist/*.tgz
            tmp/http-host-capture/
          if-no-files-found: error
          retention-days: 7
      - name: Upload HTTP browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: http-host-diagnostics-${{ runner.os }}
          path: tmp/browser-results/
          if-no-files-found: ignore
          retention-days: 7

  desktop:
    name: Windows Desktop package and update regressions
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@v6
        with:
          version: 12.5.1
          cache: true
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ieumdoc/desktop typecheck
      - run: pnpm --filter @ieumdoc/desktop test
      - name: Stable install/update regression before the final package
        if: needs.changes.outputs.update == 'true'
        run: pnpm --filter @ieumdoc/desktop test:update
      - name: Beta install/update regression before the final package
        if: needs.changes.outputs.update == 'true'
        env:
          IEUMDOC_TEST_UPDATE_CHANNEL: beta
        run: pnpm --filter @ieumdoc/desktop test:update
      - name: Build a clean package from the actual app version
        run: pnpm --filter @ieumdoc/desktop package
      - name: Validate installer and update metadata
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          pnpm --filter @ieumdoc/desktop exec tsx scripts/verify-release.ts --tag "v$version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: pnpm --filter @ieumdoc/desktop test:packaged
      - run: pnpm --filter @ieumdoc/desktop test:uninstall
        if: needs.changes.outputs.update == 'true'
      - name: Upload development installer
        uses: actions/upload-artifact@v6
        with:
          name: desktop-windows-unsigned
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.yml
          if-no-files-found: error
          retention-days: 7
      - name: Upload Desktop diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: desktop-windows-diagnostics
          path: |
            tmp/desktop-e2e/profiles/*/logs/
            tmp/desktop-update/
            tmp/desktop-uninstall/
          if-no-files-found: ignore
          retention-days: 7

  cache-warm:
    name: Refresh master dependency caches (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.reused == 'true'
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            container:
              image: mcr.microsoft.com/playwright:v1.64.0-noble
              options: --ipc=host --init
              env:
                PLAYWRIGHT_BROWSERS_PATH: /github/home/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@v6
        with:
          version: 12.5.1
          cache: true
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: /github/home/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install pinned Chromium
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: |
          pnpm exec playwright install chromium
          fc-match :lang=ko

  quality-and-browser:
    name: Core, CLI, Editor, and browser regressions
    needs: [changes, quality, browser, desktop, http, cache-warm]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks to pass
        if: ${{ always() }}
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          HTTP_RESULT: ${{ needs.http.result }}
          BROWSER_SELECTED: ${{ needs.changes.outputs.browser }}
          DESKTOP_SELECTED: ${{ needs.changes.outputs.desktop }}
          HTTP_SELECTED: ${{ needs.changes.outputs.http }}
          CACHE_SELECTED: ${{ needs.changes.outputs.reused }}
          CACHE_RESULT: ${{ needs.cache-warm.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" || "$QUALITY_RESULT" != "success" ]]; then
            echo "Required checks did not succeed: changes=$CHANGES_RESULT quality=$QUALITY_RESULT"
            exit 1
          fi
          # A selected job must succeed; only a job the path rules left out may be skipped.
          for check in "browser:$BROWSER_SELECTED:$BROWSER_RESULT" "http:$HTTP_SELECTED:$HTTP_RESULT" "desktop:$DESKTOP_SELECTED:$DESKTOP_RESULT" "cache:$CACHE_SELECTED:$CACHE_RESULT"; do
            IFS=: read -r name selected result <<< "$check"
            if [[ "$selected" == "true" && "$result" != "success" ]] || [[ "$selected" != "true" && "$result" != "skipped" ]]; then
              echo "$name: selected=$selected result=$result"
              exit 1
            fi
          done
      - name: Reject a cancelled workflow
        if: ${{ cancelled() }}
        run: exit 1
