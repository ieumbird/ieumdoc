      value: '제목은 `영역: 구체적인 증상 또는 원하는 결과`로 작성합니다. 예: `Editor: 문서 끝에서 커서 아래 여백이 부족함`. 영역을 모르면 Product를 선택합니다. 원인·구현안·테스트 계획을 추정해 채우지 않습니다. [작성 규칙](https://github.com/litzio/litzio/blob/master/docs/contributing/issues.md)'
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options:
        - Editor
        - Desktop
        - Core
        - CLI
        - Host
        - Docs
        - Product
      default: 6
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 검토 배경
      description: 어떤 사용자 문제나 요구 때문에 검토가 필요한지 적습니다.
    validations:
      required: true
  - type: textarea
    id: questions
    attributes:
      label: 결정할 사항
      description: 심층적으로 분석할 사용자 경험과 지원·보류·미지원 판단, 범위 및 선행 조건을 적습니다. 구현 착수 전에 필요한 계획을 명시합니다.
    validations:
      required: true
  - type: dropdown
    id: state
    attributes:
      label: 검토 상태
      description: 이 이슈를 등록하는 것만으로 구현 착수를 승인하지 않습니다.
      options:
        - 결정 필요
        - 향후 검토
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 근거 / 관련 자료
      description: 사용자 보고와 직접 확인한 결과를 구분하고, 확인한 코드·문서·화면·관련 이슈를 연결합니다.
    validations:
