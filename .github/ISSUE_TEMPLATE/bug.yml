# Generated by pnpm issues:forms; edit scripts/issue-policy.mjs.
name: 버그 보고
description: 관찰한 오류와 기대 동작을 기록합니다.
labels:
  - type:bug
body:
  - type: markdown
    attributes:
      value: '제목은 `영역: 구체적인 증상 또는 원하는 결과`로 작성합니다. 예: `Editor: 문서 끝에서 커서 아래 여백이 부족함`. 영역을 모르면 Product를 선택합니다. 원인·구현안·테스트 계획을 추정해 채우지 않습니다. [작성 규칙](https://github.com/litzio/litzio/blob/master/docs/contributing/issues.md)'
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options:
        - Editor
        - Desktop
        - Core
        - CLI
        - Host
        - Docs
        - Product
      default: 6
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 문제
      description: 어떤 동작을 했고 무엇을 관찰했는지 적습니다. 확인되지 않은 원인을 사실로 쓰지 않습니다.
    validations:
      required: true
  - type: textarea
    id: occurrence
    attributes:
      label: 발생 상황 / 근거
      description: 알려진 발생 상황이나 재현 절차를 적습니다. 재현하지 못했다면 사용자 보고·재현 미확인임을 명시합니다.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 사용자가 기대하는 동작을 적습니다.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 환경
      description: 알고 있는 앱 버전·OS·브라우저만 적습니다. 모르면 생략합니다.
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: 근거 / 관련 자료
      description: 사용자 보고와 직접 확인한 결과를 구분하고, 확인한 코드·문서·화면·관련 이슈를 연결합니다.
    validations:
      required: false
