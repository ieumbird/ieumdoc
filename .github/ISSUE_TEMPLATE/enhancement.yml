# Generated by pnpm issues:forms; edit scripts/issue-policy.mjs.
name: 개선·기능 제안
description: 현재 불편과 원하는 사용 경험을 기록합니다.
labels:
  - type:enhancement
body:
  - type: markdown
    attributes:
      value: '제목은 `영역: 구체적인 증상 또는 원하는 결과`로 작성합니다. 예: `Editor: 문서 끝에서 커서 아래 여백이 부족함`. 영역을 모르면 Product를 선택합니다. 원인·구현안·테스트 계획을 추정해 채우지 않습니다. [작성 규칙](https://github.com/litzio/litzio/blob/master/docs/contributing/issues.md)'
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options:
        - Editor
        - Desktop
        - Core
        - CLI
        - Host
        - Docs
        - Product
      default: 6
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 문제
      description: 어떤 일을 하려는 상황에서 무엇이 불편하거나 불가능한지 적습니다.
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: 기대하는 사용 경험
      description: 사용자에게 어떤 동작과 결과가 제공되기를 원하는지 적습니다. 구현 방식은 미리 정하지 않습니다.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 근거 / 관련 자료
      description: 사용자 보고와 직접 확인한 결과를 구분하고, 확인한 코드·문서·화면·관련 이슈를 연결합니다.
    validations:
      required: false
